services:
  backend:
    build: ./backend
    container_name: family-health-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:8000"
    depends_on:
      - postgres
    volumes:
      - /data/tech-station/family-health/data/documents:/data/documents

  postgres:
    image: postgres:17
    container_name: family-health-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_health
      POSTGRES_USER: health_app
      POSTGRES_PASSWORD: change_this_later
    volumes:
      - /data/tech-station/family-health/data/postgres:/var/lib/postgresql/data
