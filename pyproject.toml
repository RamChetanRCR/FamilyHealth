[project]
name = "familyhealth"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "python-multipart",
    "pytesseract",
    "Pillow",
]

[project.optional-dependencies]
dev = ["pytest", "httpx2"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

# ponytail: package lives under backend/, one pyproject is the only dep source.
# move to src/ layout + a lockfile (uv/poetry) when there is more than one package.
[tool.setuptools]
packages = ["app"]
package-dir = { "" = "backend" }
